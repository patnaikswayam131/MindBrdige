<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - MindBridge</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">

    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <script src="../js/dark-mode.js"></script>
</head>
<body class="bg-bg text-text selection:bg-brand selection:text-white min-h-screen flex flex-col md:flex-row-reverse">

    <!-- Right Side: Registration Form -->
    <div class="w-full md:w-1/2 flex flex-col justify-between p-8 md:p-16 lg:p-24 relative z-10 bg-bg">
        
        <!-- Logo -->
        <a href="landing.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity w-max mb-12 md:mb-0 ml-auto md:ml-0 md:mr-auto">
            <img src="../images/logo_light.png" id="logo-light" class="w-8 h-8 dark:hidden" alt="MindBridge Logo">
            <img src="../images/logo_dark.png" id="logo-dark" class="w-8 h-8 hidden dark:block" alt="MindBridge Logo">
            <span class="text-h4 font-display font-medium">MindBridge</span>
        </a>

        <!-- Form Container -->
        <div class="w-full max-w-sm mx-auto">
            
            <div id="registerStep1">
                <h1 class="text-h2 font-display mb-2">Create Account</h1>
                <p class="text-body-m text-text-secondary mb-10">Join MindBridge to start your mental wellness journey.</p>
                
                <form id="registerForm" class="space-y-6" onsubmit="handleRegisterNext(event)">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-caption font-bold uppercase tracking-wider mb-2">First Name</label>
                            <input type="text" id="regFirstName" required class="w-full bg-surface border border-border rounded-xl p-4 text-body-m focus:outline-none focus:border-brand transition-colors">
                        </div>
                        <div>
                            <label class="block text-caption font-bold uppercase tracking-wider mb-2">Last Name</label>
                            <input type="text" id="regLastName" required class="w-full bg-surface border border-border rounded-xl p-4 text-body-m focus:outline-none focus:border-brand transition-colors">
                        </div>
                    </div>

                    <div>
                        <label class="block text-caption font-bold uppercase tracking-wider mb-2">Email Address</label>
                        <input type="email" id="regEmail" required class="w-full bg-surface border border-border rounded-xl p-4 text-body-m focus:outline-none focus:border-brand transition-colors">
                    </div>
                    
                    <div>
                        <label class="block text-caption font-bold uppercase tracking-wider mb-2">Password</label>
                        <input type="password" id="regPassword" required class="w-full bg-surface border border-border rounded-xl p-4 text-body-m focus:outline-none focus:border-brand transition-colors">
                    </div>

                    <button type="submit" class="btn-primary w-full">Continue</button>
                </form>

                <div class="mt-8 text-center text-body-s text-text-secondary">
                    Already have an account? <a href="student_login.html" class="font-bold text-text hover:text-brand transition-colors">Sign In</a>
                </div>
            </div>
            
            <div id="registerStep2" class="hidden opacity-0 transition-opacity duration-500">
                <h1 class="text-h2 font-display mb-2">Brief Check-In</h1>
                <p class="text-body-m text-text-secondary mb-10">Help us understand how to support you better. You can skip this.</p>
                
                <div class="space-y-6 mb-8">
                    <div>
                        <label class="block text-caption font-bold uppercase tracking-wider mb-2">How are you feeling today?</label>
                        <select id="regFeeling" class="w-full bg-surface border border-border rounded-xl p-4 text-body-m focus:outline-none focus:border-brand transition-colors appearance-none">
                            <option value="good">Good / Stable</option>
                            <option value="anxious">Anxious / Stressed</option>
                            <option value="down">Feeling Down</option>
                            <option value="overwhelmed">Overwhelmed</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-caption font-bold uppercase tracking-wider mb-2">What brings you here?</label>
                        <textarea id="regReason" rows="3" class="w-full bg-surface border border-border rounded-xl p-4 text-body-m focus:outline-none focus:border-brand transition-colors resize-none placeholder-text-secondary/50" placeholder="Optional brief note..."></textarea>
                    </div>
                </div>
                <div class="flex flex-col-reverse sm:flex-row gap-4">
                    <button onclick="finishRegistration(true)" class="btn-secondary w-full sm:w-1/2">Skip</button>
                    <button onclick="finishRegistration(false)" class="btn-primary w-full sm:w-1/2">Complete</button>
                </div>
            </div>

        </div>

        <div class="mt-12 md:mt-0 text-caption text-text-secondary flex gap-4 md:justify-end">
            <a href="privacy_policy.html" class="hover:text-text transition-colors">Privacy</a>
            <a href="terms_of_service.html" class="hover:text-text transition-colors">Terms</a>
        </div>
    </div>

    <!-- Left Side: Image / Quote -->
    <div class="w-full md:w-1/2 relative min-h-[400px] md:min-h-screen bg-secondary overflow-hidden">
        <img src="https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?q=80&w=2940&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-multiply" alt="Calm environment">
        <div class="absolute inset-0 bg-gradient-to-t from-[#201F1B]/90 to-transparent flex items-end p-8 md:p-16">
            <div class="text-[#F3EEE5] max-w-lg">
                <h2 class="text-h3 font-display mb-4">"The journey of a thousand miles begins with one step."</h2>
                <p class="text-body-m opacity-80">— Lao Tzu</p>
            </div>
        </div>
    </div>

    <script>
        let tempUser = {};
        
        function handleRegisterNext(e) {
            e.preventDefault();
            tempUser = {
                firstName: document.getElementById('regFirstName').value,
                lastName: document.getElementById('regLastName').value,
                email: document.getElementById('regEmail').value.toLowerCase(),
                password: document.getElementById('regPassword').value,
                role: document.getElementById('regEmail').value.toLowerCase().includes('counselor') ? 'counselor' : (document.getElementById('regEmail').value.toLowerCase().includes('admin') ? 'admin' : 'student')
            };
            
            document.getElementById('registerStep1').classList.add('hidden');
            const step2 = document.getElementById('registerStep2');
            step2.classList.remove('hidden');
            setTimeout(() => step2.classList.remove('opacity-0'), 10);
        }

        function finishRegistration(skipped) {
            if (!skipped) {
                tempUser.assessment = {
                    feeling: document.getElementById('regFeeling').value,
                    reason: document.getElementById('regReason').value
                };
            }
            
            let users = JSON.parse(localStorage.getItem('users') || '{}');
            users[tempUser.email] = tempUser;
            localStorage.setItem('users', JSON.stringify(users));
            
            // Log them in immediately
            localStorage.setItem('currentUser', JSON.stringify({ 
                email: tempUser.email, 
                role: tempUser.role, 
                firstName: tempUser.firstName, 
                lastName: tempUser.lastName, 
                profilePic: null 
            }));
            
            sessionStorage.setItem('showWelcomeQuote', 'true');
            
            setTimeout(() => {
                if(tempUser.role === 'admin') {
                    window.location.href = 'admin_analytics_dashboard.html';
                } else if(tempUser.role === 'counselor') {
                    window.location.href = 'counselor_dashboard.html';
                } else {
                    window.location.href = 'onboarding.html';
                }
            }, 500);
        }
    </script>
    <script src="../js/accessibility.js"></script>
</body>
</html>
