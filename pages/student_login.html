<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MindBridge</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">

    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <script src="../js/dark-mode.js"></script>
</head>
<body class="bg-bg text-text selection:bg-brand selection:text-white min-h-screen flex flex-col md:flex-row">

    <!-- Left Side: Login Form -->
    <div class="w-full md:w-1/2 flex flex-col justify-between p-8 md:p-16 lg:p-24 relative z-10 bg-bg">
        
        <!-- Logo -->
        <a href="landing.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity w-max mb-12 md:mb-0">
            <img src="../images/logo_light.png" id="logo-light" class="w-8 h-8 dark:hidden" alt="MindBridge Logo">
            <img src="../images/logo_dark.png" id="logo-dark" class="w-8 h-8 hidden dark:block" alt="MindBridge Logo">
            <span class="text-h4 font-display font-medium">MindBridge</span>
        </a>

        <!-- Form Container -->
        <div class="w-full max-w-sm mx-auto">
            <!-- Role Selector Tabs -->
            <div class="flex p-1 bg-surface-soft rounded-xl border border-border mb-6 shadow-sm">
                <button type="button" id="tab-student" onclick="selectRole('student')" class="role-tab flex-1 py-2 text-caption font-bold rounded-lg transition-all bg-surface text-brand shadow-sm">
                    Student
                </button>
                <button type="button" id="tab-counselor" onclick="selectRole('counselor')" class="role-tab flex-1 py-2 text-caption font-bold rounded-lg transition-all text-text-secondary hover:text-text">
                    Counselor
                </button>
                <button type="button" id="tab-admin" onclick="selectRole('admin')" class="role-tab flex-1 py-2 text-caption font-bold rounded-lg transition-all text-text-secondary hover:text-text flex items-center justify-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    Admin
                </button>
            </div>

            <!-- Role Badge (Optional announcement) -->
            <div id="roleBadge" class="hidden items-center px-2.5 py-1 rounded-full text-caption font-semibold bg-brand/10 text-brand border border-brand/20 mb-3 gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <span>Institutional Access</span>
            </div>

            <h1 id="loginTitle" class="text-h2 font-display mb-2">Welcome Back</h1>
            <p id="loginSubtitle" class="text-body-m text-text-secondary mb-6">Sign in to continue your mental health journey.</p>
            
            <!-- Quick Demo 1-Click Login Bar -->
            <div class="mb-6 p-3 bg-surface border border-border rounded-xl shadow-xs">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-text-muted flex items-center gap-1">
                        <svg class="w-3 h-3 text-warning" fill="currentColor" viewBox="0 0 20 20"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/></svg>
                        1-Click Demo Login
                    </span>
                    <span class="text-[10px] text-text-secondary font-medium">Instant Access</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" onclick="quickLogin('student')" class="py-1.5 px-2 bg-surface-soft hover:bg-brand/10 hover:text-brand border border-border hover:border-brand/40 rounded-lg text-caption font-semibold text-text transition-all text-center flex items-center justify-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <span>Student</span>
                    </button>
                    <button type="button" onclick="quickLogin('counselor')" class="py-1.5 px-2 bg-surface-soft hover:bg-success/10 hover:text-success border border-border hover:border-success/40 rounded-lg text-caption font-semibold text-text transition-all text-center flex items-center justify-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        <span>Counselor</span>
                    </button>
                    <button type="button" onclick="quickLogin('admin')" class="py-1.5 px-2 bg-surface-soft hover:bg-brand/15 hover:text-brand border border-border hover:border-brand/40 rounded-lg text-caption font-semibold text-text transition-all text-center flex items-center justify-center gap-1.5 btn-tactile">
                        <svg class="w-3.5 h-3.5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <span>Admin</span>
                    </button>
                </div>
            </div>

            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
                <!-- Email -->
                <div>
                    <label for="email" id="emailLabel" class="block text-caption font-bold uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" id="email" name="email" value="student@university.edu" class="w-full bg-surface border border-border rounded-xl p-3.5 text-body-m focus:outline-none focus:border-brand transition-colors" placeholder="Enter your email" required />
                </div>
                
                <!-- Password -->
                <div>
                    <label for="password" class="block text-caption font-bold uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" value="password123" class="w-full bg-surface border border-border rounded-xl p-3.5 text-body-m focus:outline-none focus:border-brand transition-colors pr-12" placeholder="Enter your password" required />
                        <button type="button" class="absolute inset-y-0 right-4 flex items-center text-text-secondary hover:text-text transition-colors" onclick="togglePassword()" title="Toggle password visibility">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-body-s">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded text-brand focus:ring-brand border-border" />
                        <span class="text-text-secondary hover:text-text transition-colors">Remember me</span>
                    </label>
                    <a href="#" class="font-bold text-brand hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary w-full py-3.5 shadow-md">Sign In</button>
                
                <button type="button" id="biometricBtn" class="w-full flex items-center justify-center gap-3 py-3 border border-border rounded-xl hover:bg-surface-soft transition-colors font-medium text-body-m" onclick="handleBiometric()">
                    <svg class="w-5 h-5 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/>
                    </svg>
                    <span>Biometric Sign In</span>
                </button>
            </form>

            <div id="registerFooter" class="mt-8 text-center text-body-s text-text-secondary">
                Don't have an account? <a href="student_register.html" class="font-bold text-text hover:text-brand transition-colors">Create Account</a>
            </div>
            
            <div class="mt-6 text-center">
                <a href="ai_mental_health_chatbot.html" class="text-caption font-bold text-brand uppercase tracking-wider hover:underline flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    Continue as Guest
                </a>
            </div>
        </div>

        <div class="mt-12 md:mt-0 text-caption text-text-secondary flex gap-4">
            <a href="privacy_policy.html" class="hover:text-text transition-colors">Privacy</a>
            <a href="terms_of_service.html" class="hover:text-text transition-colors">Terms</a>
        </div>
    </div>

    <!-- Right Side: Image / Quote -->
    <div class="w-full md:w-1/2 relative min-h-[400px] md:min-h-screen bg-secondary overflow-hidden">
        <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=2940&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-multiply" alt="Peaceful meditation">
        <div class="absolute inset-0 bg-gradient-to-t from-[#201F1B]/90 to-transparent flex items-end p-8 md:p-16">
            <div class="text-[#F3EEE5] max-w-lg">
                <h2 class="text-h3 font-display mb-4">"Peace comes from within. Do not seek it without."</h2>
                <p class="text-body-m opacity-80">— Buddha</p>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'student';

        function selectRole(role) {
            currentRole = role;
            const tabStudent = document.getElementById('tab-student');
            const tabCounselor = document.getElementById('tab-counselor');
            const tabAdmin = document.getElementById('tab-admin');
            const loginTitle = document.getElementById('loginTitle');
            const loginSubtitle = document.getElementById('loginSubtitle');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const roleBadge = document.getElementById('roleBadge');
            const registerFooter = document.getElementById('registerFooter');
            const emailLabel = document.getElementById('emailLabel');

            // Reset tabs
            const inactiveClass = 'role-tab flex-1 py-2 text-caption font-bold rounded-lg transition-all text-text-secondary hover:text-text';
            if (tabStudent) tabStudent.className = inactiveClass;
            if (tabCounselor) tabCounselor.className = inactiveClass;
            if (tabAdmin) tabAdmin.className = inactiveClass + ' flex items-center justify-center gap-1';

            if (role === 'admin') {
                if (tabAdmin) tabAdmin.className = 'role-tab flex-1 py-2 text-caption font-bold rounded-lg transition-all bg-brand text-white shadow-sm flex items-center justify-center gap-1';
                if (loginTitle) loginTitle.textContent = 'Administrator Portal';
                if (loginSubtitle) loginSubtitle.textContent = 'Sign in for institutional oversight, analytics & campus wellbeing governance.';
                if (emailInput) emailInput.value = 'admin@university.edu';
                if (passwordInput) passwordInput.value = 'admin123';
                if (submitBtn) submitBtn.textContent = 'Sign In to Admin Portal';
                if (emailLabel) emailLabel.textContent = 'Administrator Email';
                if (roleBadge) {
                    roleBadge.innerHTML = '<svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg> Institutional Access • University Administration';
                    roleBadge.className = 'inline-flex items-center px-2.5 py-1 rounded-full text-caption font-semibold bg-brand/10 text-brand border border-brand/20 mb-3';
                    roleBadge.classList.remove('hidden');
                }
                if (registerFooter) registerFooter.innerHTML = 'Need administrator credentials? <span class="font-medium text-text">Contact Campus IT</span>';
            } else if (role === 'counselor') {
                if (tabCounselor) tabCounselor.className = 'role-tab flex-1 py-2 text-caption font-bold rounded-lg transition-all bg-brand text-white shadow-sm';
                if (loginTitle) loginTitle.textContent = 'Counselor Portal';
                if (loginSubtitle) loginSubtitle.textContent = 'Access appointments, student caseload, and session management.';
                if (emailInput) emailInput.value = 'counselor@university.edu';
                if (passwordInput) passwordInput.value = 'counselor123';
                if (submitBtn) submitBtn.textContent = 'Sign In as Counselor';
                if (emailLabel) emailLabel.textContent = 'Clinical Staff Email';
                if (roleBadge) {
                    roleBadge.innerHTML = '<svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg> Clinical Staff • Licensed Counseling';
                    roleBadge.className = 'inline-flex items-center px-2.5 py-1 rounded-full text-caption font-semibold bg-success/10 text-success border border-success/20 mb-3';
                    roleBadge.classList.remove('hidden');
                }
                if (registerFooter) registerFooter.innerHTML = 'Counselor account setup requires institutional licensing approval.';
            } else {
                if (tabStudent) tabStudent.className = 'role-tab flex-1 py-2 text-caption font-bold rounded-lg transition-all bg-surface text-brand shadow-sm';
                if (loginTitle) loginTitle.textContent = 'Welcome Back';
                if (loginSubtitle) loginSubtitle.textContent = 'Sign in to continue your mental health journey.';
                if (emailInput) emailInput.value = 'student@university.edu';
                if (passwordInput) passwordInput.value = 'password123';
                if (submitBtn) submitBtn.textContent = 'Sign In';
                if (emailLabel) emailLabel.textContent = 'Email Address';
                if (roleBadge) roleBadge.classList.add('hidden');
                if (registerFooter) registerFooter.innerHTML = "Don't have an account? <a href=\"student_register.html\" class=\"font-bold text-text hover:text-brand transition-colors\">Create Account</a>";
            }
        }

        function quickLogin(role) {
            selectRole(role);
            setTimeout(() => {
                const form = document.getElementById('loginForm');
                if (form) {
                    handleLogin(new Event('submit', { cancelable: true }));
                }
            }, 50);
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                `;
            }
        }

        function handleLogin(event) {
            if (event && event.preventDefault) event.preventDefault();
            const email = document.getElementById('email').value.toLowerCase().trim();
            const password = document.getElementById('password').value;
            
            if (email && password) {
                const button = document.getElementById('submitBtn');
                if (button) {
                    button.innerHTML = 'Signing In...';
                    button.disabled = true;
                }

                // Determine final role
                let role = currentRole;
                if (email.includes('admin')) role = 'admin';
                else if (email.includes('counselor')) role = 'counselor';
                
                let users = JSON.parse(localStorage.getItem('users') || '{}');
                if (!users[email]) {
                    users[email] = { 
                        password: password, 
                        role: role,
                        firstName: role === 'admin' ? 'Administrator' : (role === 'counselor' ? 'Dr. Sarah' : 'Student')
                    };
                    localStorage.setItem('users', JSON.stringify(users));
                }
                
                const userObj = users[email];
                const currentUserData = { 
                    email: email, 
                    role: role, 
                    firstName: role === 'admin' ? 'Admin' : (role === 'counselor' ? 'Dr. Sarah' : (userObj.firstName || 'Student')), 
                    lastName: role === 'admin' ? 'Oversight' : (role === 'counselor' ? 'Jenkins' : ''), 
                    profilePic: userObj.profilePic || null 
                };
                localStorage.setItem('currentUser', JSON.stringify(currentUserData));
                sessionStorage.setItem('showWelcomeQuote', 'true');
                
                setTimeout(() => {
                    if (role === 'admin') {
                        window.location.href = 'admin_analytics_dashboard.html';
                    } else if (role === 'counselor') {
                        window.location.href = 'counselor_dashboard.html';
                    } else {
                        window.location.href = 'student_dashboard.html';
                    }
                }, 500);
            }
        }

        // Check for URL query param e.g. ?role=admin
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const roleParam = params.get('role');
            if (roleParam === 'admin' || roleParam === 'counselor') {
                selectRole(roleParam);
            }
        });

        function handleBiometric() {
            if ('credentials' in navigator) {
                alert('Biometric authentication simulated: Credentials verified successfully.');
                handleLogin(new Event('submit'));
            } else {
                alert('Biometric authentication not supported on this device. Using standard password login.');
            }
        }
    </script>
    <script src="../js/accessibility.js"></script>
</body>
</html>
